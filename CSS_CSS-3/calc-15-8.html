<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 70%;
        height: 500px;
        background-color: bisque;
        border-radius: 8px;
        margin: 50px;
        position: relative;
      }
      .inner-box {
        height: 50px;
        width: 50px;
        background-color: tomato;
        border-radius: 8px;
        position: absolute;
        top: 0;
        left: calc(100% + 30px);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="inner-box"></div>
    </div>
  </body>
</html>
