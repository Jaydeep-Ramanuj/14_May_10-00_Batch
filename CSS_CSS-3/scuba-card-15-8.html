<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }
      .scuba {
        border-radius: 12px;
        background-image: url(https://images.pexels.com/photos/3098971/pexels-photo-3098971.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1);
        max-width: 400px;
        min-height: 400px;
        margin: 50px auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: end;
        align-items: center;
        color: white;
        position: relative;
        isolation: isolate;
        background-position: center;
      }
      h2 {
        font-size: 48px;
        font-weight: 600;
      }
      p {
        max-width: 90%;
        text-align: center;
      }
      a {
        margin-top: 20px;
        text-decoration: none;
        padding: 5px 15px;
        background-color: white;
        border-radius: 18px;
        color: black;
      }
      .scuba::before {
        content: '';
        height: 100%;
        width: 100%;
        border-radius: inherit;
        position: absolute;
        background-image: linear-gradient(200deg, transparent, #212121e0 60%);
        top: 0;
        left: 0;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="scuba">
      <h2>Scuba Diving</h2>
      <p>
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Voluptatem
        odit, voluptate nihil et deserunt soluta.
      </p>
      <a href="#">Book now</a>
    </div>
  </body>
</html>
